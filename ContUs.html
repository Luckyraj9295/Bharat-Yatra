<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/images/mountain-sun-solid.png" />
  <title>Contact Us - Bharat Yatra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    .df-close-btn {
      position: fixed;
      bottom: 96px;
      right: 26px;
      z-index: 1000;
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 6px 10px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50%;
      cursor: pointer;
      display: none;
    }
    .chat-close-top {
      position: fixed;
      right: 26px;
      bottom: 620px;
      z-index: 1000;
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 4px 10px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50%;
      cursor: pointer;
      display: none;
    }
    
    @keyframes bounce-in {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(-10px);
      }
      50% {
        transform: scale(1.05);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    
    .animate-bounce-in {
      animation: bounce-in 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    
    @keyframes gradient-shift {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }
    
    input:focus, textarea:focus {
      animation: pulse-shadow 0.6s ease-in-out;
    }
    
    @keyframes pulse-shadow {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(249, 115, 22, 0);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(249, 115, 22, 0.1);
      }
    }
  </style>
</head>
<body class="bg-orange-50 text-gray-800 min-h-screen">
  <div class="max-w-6xl mx-auto py-8 px-2 sm:py-16 sm:px-4">
    <div class="flex items-center mb-12">
      <a href="index.html" class="group flex items-center justify-center h-10 w-10 rounded-full transition duration-200">
        <span class="flex items-center justify-center h-10 w-10 rounded-full group-hover:bg-orange-100 transition duration-200">
          <img src="https://cdn-icons-png.flaticon.com/512/271/271220.png" alt="Back Arrow Icon" class="h-5 w-5 transition duration-200 group-hover:scale-125 group-hover:filter group-hover:brightness-0 group-hover:invert group-hover:sepia group-hover:hue-rotate-15 group-hover:saturate-200" style="filter: none;" />
        </span>
      </a>
      <div class="flex-1 flex justify-center grow">
        <h1 class="text-4xl font-bold text-orange-600">Contact Us</h1>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
      <!-- AI Chat Card -->
      <div class="bg-gradient-to-br from-blue-50 to-white rounded-2xl shadow-xl p-6 sm:p-10 flex flex-col transition-all duration-300 hover:shadow-2xl border border-blue-100 h-full">
        <div class="text-center flex flex-col flex-grow">
          <div class="mb-6">
            <div class="relative inline-block">
              <div class="absolute inset-0 bg-blue-200 rounded-full blur-xl opacity-60 animate-pulse"></div>
              <img src="https://cdn-icons-png.flaticon.com/512/13593/13593850.png" alt="Chatbot Icon" class="relative mx-auto h-20 w-20 animate-bounce">
            </div>
          </div>
          <h2 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-blue-700 mb-3">Chat with AI Assistant</h2>
          <p class="text-gray-600 mb-6 text-sm">Get instant answers about tours, pricing, destinations, and travel packages from our smart AI buddy.</p>
          <div class="flex justify-center mb-6">
            <img src="https://cdn-icons-png.flaticon.com/512/14958/14958196.png" alt="Assistant Robot Icon" class="h-40 w-40 drop-shadow-lg" style="object-fit:contain;" />
          </div>
        </div>
        <button id="startChatBtn" class="bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold py-4 px-6 rounded-xl hover:from-blue-600 hover:to-blue-700 transform hover:scale-105 transition-all duration-300 shadow-lg hover:shadow-xl self-center w-full flex items-center justify-center gap-2 group">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
          <span>Start Chat with BharatBuddy</span>
        </button>
      </div>
      <!-- Customer Support Card -->
      <div class="bg-gradient-to-br from-orange-50 to-white rounded-2xl shadow-xl p-6 sm:p-10 transition-all duration-300 hover:shadow-2xl border border-orange-100">
        <div class="flex justify-center mb-6">
          <div class="relative">
            <div class="absolute inset-0 bg-orange-200 rounded-full blur-xl opacity-60 animate-pulse"></div>
            <img src="https://cdn-icons-png.flaticon.com/512/1067/1067566.png" alt="Support Icon" class="relative h-20 w-20 animate-bounce">
          </div>
        </div>
        <h2 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-orange-700 mb-3 text-center">Get In Touch</h2>
        <p class="text-gray-600 mb-8 text-center text-sm">We'd love to hear from you! Drop us a message and we'll respond within 24 hours.</p>
        
        <form id="contactForm" class="space-y-6">
          <!-- Name Input -->
          <div class="relative">
            <div class="absolute left-4 top-1/2 transform -translate-y-1/2 text-orange-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </div>
            <input 
              type="text" 
              id="name" 
              placeholder="Full Name" 
              required 
              class="w-full pl-12 pr-4 py-3.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:ring-4 focus:ring-orange-100 transition-all duration-300 outline-none bg-white/50 backdrop-blur-sm hover:border-orange-300"
            >
          </div>
          
          <!-- Email Input -->
          <div class="relative">
            <div class="absolute left-4 top-1/2 transform -translate-y-1/2 text-orange-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </div>
            <input 
              type="email" 
              id="email" 
              placeholder="Email Address" 
              required 
              class="w-full pl-12 pr-4 py-3.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:ring-4 focus:ring-orange-100 transition-all duration-300 outline-none bg-white/50 backdrop-blur-sm hover:border-orange-300"
            >
          </div>
          
          <!-- Message Textarea -->
          <div class="relative">
            <div class="absolute left-4 top-4 text-orange-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
              </svg>
            </div>
            <textarea 
              id="message" 
              placeholder="Your Message" 
              required 
              rows="5" 
              class="w-full pl-12 pr-4 py-3.5 border-2 border-orange-200 rounded-xl focus:border-orange-500 focus:ring-4 focus:ring-orange-100 transition-all duration-300 outline-none bg-white/50 backdrop-blur-sm hover:border-orange-300 resize-none"
            ></textarea>
          </div>
          
          <!-- Submit Button -->
          <button 
            type="submit" 
            class="w-full bg-gradient-to-r from-orange-500 to-orange-600 text-white font-bold py-4 px-6 rounded-xl hover:from-orange-600 hover:to-orange-700 transform hover:scale-105 transition-all duration-300 shadow-lg hover:shadow-xl flex items-center justify-center gap-2 group"
          >
            <span>Send Message</span>
            <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </button>
        </form>
        
        <!-- Success Message -->
        <div id="supportSuccess" class="mt-6 hidden">
          <div class="bg-gradient-to-r from-green-50 to-emerald-50 border-2 border-green-300 rounded-xl p-4 flex items-center gap-3 animate-bounce-in">
            <div class="flex-shrink-0">
              <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <div>
              <p class="text-green-800 font-semibold">Message sent successfully! ✨</p>
              <p class="text-green-600 text-sm">We'll get back to you soon.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Greeting Toast -->

  <!-- Manual Close Button on Top -->
  <button id="closeChatTop" class="chat-close-top">×</button>

  <!-- Dialogflow Messenger -->
  <df-messenger
    chat-icon="https://cdn-icons-png.flaticon.com/512/9732/9732800.png"
    intent="WELCOME"
    chat-title="BharatBuddy"
    agent-id="9feb8c43-9237-4bc7-bfd4-60f85f004402"
    language-code="en"
  ></df-messenger>



  <!-- Trigger Button Script -->
  <script>
    const startBtn = document.getElementById("startChatBtn");
    const topCloseBtn = document.getElementById("closeChatTop");

    let chatOpenedByButton = false;

    function showCloseBtn() {
      if (chatOpenedByButton) {
        topCloseBtn.style.display = 'block';
      }
    }

    function hideCloseBtn() {
      topCloseBtn.style.display = 'none';
    }

    function listenForChatOpen() {
      const dfMessenger = document.querySelector("df-messenger");
      if (!dfMessenger || !dfMessenger.shadowRoot) return;

      const observer = new MutationObserver(() => {
        const isChatOpen = dfMessenger.shadowRoot.querySelector("df-messenger-chat")?.shadowRoot?.querySelector(".chat-wrapper");
        if (isChatOpen) {
          showCloseBtn();
        } else {
          hideCloseBtn();
          chatOpenedByButton = false;
        }
      });

      observer.observe(dfMessenger.shadowRoot, { childList: true, subtree: true });
    }

    startBtn.addEventListener("click", () => {
      chatOpenedByButton = true;
      const waitForMessenger = setInterval(() => {
        const dfMessenger = document.querySelector("df-messenger");
        if (!dfMessenger || !dfMessenger.shadowRoot) return;

        const chatToggle = dfMessenger.shadowRoot.querySelector("div[aria-label='Chat with BharatBuddy']") ||
                           dfMessenger.shadowRoot.querySelector("button[aria-label='Open chat']") ||
                           dfMessenger.shadowRoot.querySelector("button[aria-label='Expand Chat']") ||
                           dfMessenger.shadowRoot.querySelector("button");

        if (chatToggle) {
          chatToggle.click();
          showCloseBtn();
          clearInterval(waitForMessenger);
        }
      }, 300);
    });

    topCloseBtn.addEventListener("click", () => {
      const dfMessenger = document.querySelector("df-messenger");
      if (dfMessenger && dfMessenger.shadowRoot) {
        const closeBtnInner = dfMessenger.shadowRoot.querySelector("button[aria-label='Close chat']") || dfMessenger.shadowRoot.querySelector("button[aria-label='Minimize chat']") || dfMessenger.shadowRoot.querySelector("button");
        if (closeBtnInner) closeBtnInner.click();
        topCloseBtn.style.display = 'none';
        chatOpenedByButton = false;
      }
    });

    window.addEventListener("load", () => {
      listenForChatOpen();
    });
  </script>
<script>
document.getElementById("contactForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const message = document.getElementById("message").value.trim();
  const successBox = document.getElementById("supportSuccess");
  const submitBtn = e.target.querySelector('button[type="submit"]');
  
  // Store original button HTML
  const originalBtnHTML = submitBtn.innerHTML;
  
  // Show loading state
  submitBtn.disabled = true;
  submitBtn.innerHTML = `
    <svg class="animate-spin h-5 w-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
  `;

  try {
    const response = await fetch("https://bharat-yatra.onrender.com/api/contact", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ name, email, message })
    });

    const data = await response.json();

    if (response.ok) {
      // Show success message
      successBox.classList.remove("hidden");
      this.reset();
      
      // Hide success message after 5 seconds
      setTimeout(() => {
        successBox.classList.add("hidden");
      }, 5000);
      
      // Reset button
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalBtnHTML;
    } else {
      alert(data.message || "Failed to send message.");
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalBtnHTML;
    }

  } catch (error) {
    console.error(error);
    alert("Server error. Please try again later.");
    submitBtn.disabled = false;
    submitBtn.innerHTML = originalBtnHTML;
  }
});
</script>
  

  <!-- Load Dialogflow -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
</body>
</html>
